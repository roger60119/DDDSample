services:
  dddsample:
    build:
      context: .
      dockerfile: ./DDDSample/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Https__Url=https://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path=/https/dddsample.pfx
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password=roger_12345
      - TZ=Asia/Taipei
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - redis
      - sqlserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./https:/https:ro


  redis:
    image: redis:7.2-alpine
    container_name: dddsample-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dddsample-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=abc_1234
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  redis_data:
  sqlserver_data: